<script type="module">
import { wrongFeedback, animateChange, reducedMotion } from '../grid-rush/src/playground-ui.js';
import { springStep } from '../grid-rush/src/motion.js';
import { getLanguage } from '../grid-rush/src/language.js';
'use strict';
const playerName = number => getLanguage() === 'zh-Hant' ? `玩家 ${number}` : `Player ${number}`;
const $ = s => document.querySelector(s);
const W = 360, H = 460;
const MAX_RATE = 420;      // units/sec at fully open tap
const MIN_POUR = 25;       // minimum units per turn...
const MIN_TIME = 0.25;     // ...or minimum seconds of pouring
const COLORS = ['#ff6b6b', '#ffb84d', '#ffe066', '#51cf66', '#4dabf7', '#b197fc', '#f783ac', '#63e6be'];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- Audio ---------- */
class AudioFx {
  constructor() { this.muted = false; this.ctx = null; }
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(c.destination);
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    this.bp = c.createBiquadFilter(); this.bp.type = 'bandpass'; this.bp.Q.value = 0.8;
    this.pg = c.createGain(); this.pg.gain.value = 0;
    src.connect(this.bp).connect(this.pg).connect(this.master); src.start();
  }
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 1; }
  flow(o) { // thin trickle = low/quiet, torrent = bright/loud
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.pg.gain.setTargetAtTime(o > 0.02 ? 0.03 + o * 0.45 : 0, t, 0.05);
    this.bp.frequency.setTargetAtTime(700 + o * 2600, t, 0.05);
  }
  burst(freq0, freq1, dur, vol, type = 'lowpass') {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = type;
    f.frequency.setValueAtTime(freq0, t); f.frequency.exponentialRampToValueAtTime(freq1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random()); s.stop(t + dur);
  }
  open() { this.burst(300, 2000, 0.12, 0.3, 'bandpass'); this.thump(140, 0.25, 0.08); }
  thump(freq, vol, dur) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  }
  heartbeat() { this.thump(60, 0.7, 0.14); setTimeout(() => this.thump(52, 0.45, 0.14), 170); }
  splash() { this.burst(4000, 250, 1, 0.8); setTimeout(() => this.burst(2500, 200, 0.7, 0.5), 150); }
}

/* ---------- Input: pressure with graceful fallback ---------- */
class InputHandler {
  constructor(el, cb) {
    this.el = el; this.cb = cb; this.active = false; this.id = null;
    this.vals = new Set(); this.capable = false; this.p = 0;
    el.addEventListener('pointerdown', e => {
      if (this.active) return;
      this.id = e.pointerId; this.active = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      this.t0 = performance.now(); this.y0 = this.y = e.clientY;
      this.track(e); cb.start();
    });
    el.addEventListener('pointermove', e => { if (e.pointerId === this.id) { this.y = e.clientY; this.track(e); } });
    const up = e => { if (e.pointerId === this.id) this.end(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('blur', () => this.end());
  }
  track(e) {
    this.p = e.pressure;
    if (e.pressure > 0) this.vals.add(Math.round(e.pressure * 100));
    // constant 0.5 (or a couple of values) means no real force sensing
    if (this.vals.size >= 3) this.capable = true;
  }
  end() { if (!this.active) return; this.active = false; this.cb.end(); }
  get mode() { return this.capable ? 'pressure' : 'fallback'; }
  // returns tap opening 0..1
  read(now) {
    if (this.capable) return clamp(this.p, 0, 1);
    const hold = clamp((now - this.t0) / 2500, 0, 1);
    const drag = clamp((this.y - this.y0) / (this.el.clientHeight * 0.35), 0, 1);
    return Math.max(hold, drag);
  }
}

/* ---------- Water rendering ---------- */
class WaterSimulation {
  constructor(cv) {
    this.cv = cv; this.c = cv.getContext('2d');
    this.T = 190; this.B = 390; this.XL = 100; this.XR = 260; this.BL = 120; this.BR = 240; this.NX = 180; this.NY = 100;
    this.reset(); this.resize();
  }
  reset() { this.level = 0; this.opening = 0; this.lever = 0; this.leverVelocity = 0; this.flowing = false; this.amp = 0; this.ampVelocity = 0; this.parts = []; this.t = 0; this.spilling = false; this.spill = 0; this.gauge = false; }
  resize() {
    const r = this.cv.getBoundingClientRect(), d = devicePixelRatio || 1;
    this.cv.width = Math.round(r.width * d); this.cv.height = Math.round(r.height * d);
    // Fit the scene uniformly so a short viewport cannot squash the cup.
    this.scale = Math.min(this.cv.width / W, this.cv.height / H);
    this.offsetX = (this.cv.width - W * this.scale) / 2;
    this.offsetY = (this.cv.height - H * this.scale) / 2;
  }
  get dome() { return this.level > 1 ? clamp((this.level - 1) / 0.10, 0, 1) * 16 : 0; }
  surf(x) {
    const { T, B, XL, XR } = this;
    const base = this.level <= 1 ? B - 6 - this.level * (B - 6 - T) : T;
    const w = this.amp * (Math.sin(x * 0.09 + this.t * 6) + 0.6 * Math.sin(x * 0.17 - this.t * 9)) * (this.level > 1 ? 0.4 : 1);
    return base + w - this.dome * Math.sin(Math.PI * clamp((x - XL) / (XR - XL), 0, 1));
  }
  update(dt) {
    this.t += dt;
    const target = this.flowing ? 1.5 + this.opening * 4 : 0;
    if (reducedMotion.matches) {
      this.amp = this.ampVelocity = this.leverVelocity = 0; this.lever = this.opening; this.parts.length = 0;
    } else {
      const wave = springStep(this.amp,this.ampVelocity,target,dt,{stiffness:110,damping:14,mass:1.2});
      this.amp = wave.position; this.ampVelocity = wave.velocity;
      const lever = springStep(this.lever,this.leverVelocity,this.opening,dt,{stiffness:280,damping:22,mass:0.8});
      this.lever = lever.position; this.leverVelocity = lever.velocity;
    }
    if (!reducedMotion.matches && this.flowing && this.opening > 0.03) {
      const n = Math.floor(this.opening * 60 * dt + Math.random());
      for (let i = 0; i < n; i++) this.parts.push({ x: this.NX + (Math.random() - .5) * 6, y: this.surf(this.NX), vx: (Math.random() - .5) * (60 + this.opening * 180), vy: -(80 + Math.random() * 200) * (0.3 + this.opening), r: 1.2 + Math.random() * 1.8 });
    }
    if (this.spilling) {
      this.spill += dt;
      if (!reducedMotion.matches && Math.random() < 0.8) for (const s of [-1, 1]) this.parts.push({ x: s < 0 ? this.XL : this.XR, y: this.T, vx: s * (30 + Math.random() * 60), vy: -Math.random() * 90, r: 1.5 + Math.random() * 2 });
    }
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const inCup = p.x > this.XL && p.x < this.XR;
      const surface = inCup ? this.surf(p.x) : this.B;
      if (p.vy > 0 && p.y > surface) {
        if (p.bounced) this.parts.splice(i, 1);
        else {
          // Decorative droplets collide once, then settle; poured volume stays authoritative.
          p.y = surface; p.vy *= -Math.min(0.4,0.65/p.r); p.vx *= 0.55; p.bounced = true;
          if (inCup) this.ampVelocity = Math.min(12,this.ampVelocity+p.r*0.5);
        }
      }
    }
  }
  poly(c) {
    const {XL,XR,BL,BR,T,B}=this;
    c.beginPath();c.moveTo(XL+8,T);c.lineTo(XR-8,T);c.quadraticCurveTo(XR,T,XR,T+8);
    c.lineTo(BR+3,B-10);c.quadraticCurveTo(BR,B,BR-8,B);c.lineTo(BL+8,B);
    c.quadraticCurveTo(BL,B,BL-3,B-10);c.lineTo(XL,T+8);c.quadraticCurveTo(XL,T,XL+8,T);c.closePath();
  }
  drawFace(c) {
    const B=this.B, expression=this.spilling?'crying':this.level>=.85?'worried':'happy';
    if(this.cv.dataset.expression!==expression){
      this.cv.dataset.expression=expression;
      this.cv.setAttribute('aria-label',expression==='crying'?'The cup is crying. Water overflowed.':expression==='worried'?'The cup is worried. Almost full!':'The cup is smiling.');
    }
    c.save();c.lineCap='round';c.lineJoin='round';
    c.fillStyle='#eea8a0a6';
    for(const x of [149,211]){c.beginPath();c.ellipse(x,B-49,9,4.5,0,0,7);c.fill();}
    if(expression==='crying'){
      // Steady tears remain visible with reduced motion and do not affect water volume.
      c.fillStyle='#57b8e8';
      for(const x of [164,196]){
        c.beginPath();c.roundRect(x-3.5,B-57,7,27,3.5);c.fill();
        c.beginPath();c.ellipse(x,B-28,4.5,6,0,0,7);c.fill();
        c.strokeStyle='#d4f4ff';c.lineWidth=1.5;c.beginPath();c.moveTo(x-1,B-54);c.lineTo(x-1,B-37);c.stroke();
      }
      c.strokeStyle='#405e59';c.lineWidth=3;
      for(const x of [164,196]){c.beginPath();c.moveTo(x-6,B-59);c.quadraticCurveTo(x,B-66,x+6,B-59);c.stroke();}
      c.fillStyle='#855568';c.beginPath();c.ellipse(180,B-42,8,10,0,0,7);c.fill();
      c.strokeStyle='#405e59';c.lineWidth=2;c.stroke();
      c.fillStyle='#f2b4b2';c.beginPath();c.ellipse(180,B-37,5,3,0,0,7);c.fill();
    }else{
      c.fillStyle='#405e59';
      for(const x of [164,196]){c.beginPath();c.ellipse(x,B-58,3.5,expression==='worried'?5.5:5,0,0,7);c.fill();}
      c.strokeStyle='#405e59';c.lineWidth=2.7;c.beginPath();
      if(expression==='worried'){
        c.moveTo(158,B-72);c.lineTo(169,B-77);c.moveTo(191,B-77);c.lineTo(202,B-72);
        c.moveTo(174,B-40);c.quadraticCurveTo(180,B-48,186,B-40);c.stroke();
        c.fillStyle='#57b8e8';c.beginPath();c.moveTo(215,B-77);c.quadraticCurveTo(206,B-65,215,B-64);c.quadraticCurveTo(224,B-65,215,B-77);c.fill();
      }else{
        c.moveTo(174,B-45);c.quadraticCurveTo(180,B-37,186,B-45);c.stroke();
      }
    }
    c.restore();
  }
  draw() {
    const c = this.c, { T, B, XL, XR, BL, BR, NX, NY } = this;
    c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,this.cv.width,this.cv.height);
    c.setTransform(this.scale,0,0,this.scale,this.offsetX,this.offsetY);
    // table + puddle
    c.fillStyle = '#efd9b3'; c.fillRect(0, B, W, H - B);
    c.strokeStyle='#d3b992';c.lineWidth=3;c.beginPath();c.moveTo(0,B+1);c.lineTo(W,B+1);c.stroke();
    c.fillStyle='#e0c298';for(let x=18;x<W;x+=32){c.beginPath();c.arc(x,B+40,2.5,0,7);c.fill();}
    c.fillStyle='#c2b78a45';c.beginPath();c.ellipse(180,B+8,82,10,0,0,7);c.fill();
    // Soft cloud puffs and twinkles keep the scene playful without distracting motion.
    c.fillStyle='#fffdf1b3';
    for(const [x,y] of [[55,120],[300,160]]){c.beginPath();c.ellipse(x,y,24,10,0,0,7);c.ellipse(x-8,y-5,13,12,0,0,7);c.ellipse(x+7,y-7,12,12,0,0,7);c.fill();}
    c.strokeStyle='#d3b475';c.lineWidth=2.5;c.lineCap='round';
    for(const [x,y] of [[78,74],[288,82]]){c.beginPath();c.moveTo(x-5,y);c.lineTo(x+5,y);c.moveTo(x,y-5);c.lineTo(x,y+5);c.stroke();}
    if (this.spill > 0) {
      c.fillStyle = 'rgba(110,198,255,.75)'; c.beginPath();
      c.ellipse(180, B + 16, Math.min(this.spill * 55, 190), Math.min(this.spill * 8, 22), 0, 0, 7); c.fill();
    }
    // cup back
    this.poly(c); c.fillStyle = 'rgba(255,255,250,.78)'; c.fill();
    // water
    c.save();
    c.beginPath(); c.moveTo(XL, T - 40); c.lineTo(XR, T - 40); c.lineTo(XR, T); c.lineTo(BR, B); c.lineTo(BL, B); c.lineTo(XL, T); c.closePath(); c.clip();
    if (this.level > 0) {
      const g = c.createLinearGradient(0, T, 0, B); g.addColorStop(0, '#a6e7ed'); g.addColorStop(1, '#60bfd9');
      c.beginPath(); c.moveTo(XL - 5, this.surf(XL - 5));
      for (let x = XL - 5; x <= XR + 5; x += 6) c.lineTo(x, this.surf(x));
      c.lineTo(XR + 5, B); c.lineTo(XL - 5, B); c.closePath();
      c.globalAlpha = .92; c.fillStyle = g; c.fill(); c.globalAlpha = 1;
      c.beginPath(); for (let x = XL - 5; x <= XR + 5; x += 6) c[x === XL - 5 ? 'moveTo' : 'lineTo'](x, this.surf(x));
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.stroke();
    }
    c.restore();
    // glass
    this.poly(c); c.strokeStyle = '#607c76'; c.lineWidth = 3.5; c.lineJoin = 'round'; c.stroke();
    c.beginPath(); c.moveTo(XL + 12, T + 14); c.lineTo(BL + 10, B - 20); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 5; c.lineCap = 'round'; c.stroke();
    // Rounded mint tap, peach handle and a little face above the spout.
    c.lineJoin='round';c.lineWidth=3;c.strokeStyle='#668479';
    c.fillStyle='#a9d6c5';c.beginPath();c.roundRect(102,38,40,26,12);c.fill();c.stroke();
    c.beginPath();c.roundRect(169,58,22,39,9);c.fill();c.stroke();
    c.fillStyle='#c0e4ce';c.beginPath();c.roundRect(127,27,103,42,18);c.fill();c.stroke();
    c.strokeStyle='#effbed';c.lineWidth=4;c.beginPath();c.moveTo(143,35);c.lineTo(178,35);c.stroke();
    c.fillStyle='#405e59';for(const x of [160,196]){c.beginPath();c.arc(x,48,2.7,0,7);c.fill();}
    c.fillStyle='#f0b7a4';for(const x of [149,207]){c.beginPath();c.ellipse(x,55,6,3,0,0,7);c.fill();}
    c.strokeStyle='#668479';c.lineWidth=2;c.beginPath();c.moveTo(173,55);c.quadraticCurveTo(178,61,183,55);c.stroke();
    c.fillStyle='#ffdfac';c.strokeStyle='#9c8c68';c.lineWidth=2.5;c.beginPath();c.roundRect(163,88,34,12,6);c.fill();c.stroke();
    c.fillStyle='#6b918a';c.beginPath();c.ellipse(NX,99,10,2.5,0,0,7);c.fill();
    c.save();c.translate(224,42);c.rotate(-this.lever*1.05);
    c.fillStyle='#f5b19e';c.strokeStyle='#a47e6b';c.lineWidth=2.5;c.beginPath();c.roundRect(-3,-5,31,10,5);c.fill();c.stroke();
    c.fillStyle='#ffd3b3';c.beginPath();c.arc(30,0,9,0,7);c.fill();c.stroke();c.restore();
    // stream
    if (this.flowing && this.opening > 0.03) {
      const sy = this.surf(NX), o = this.opening, w = 1.5 + Math.pow(o, .8) * 13;
      if (o < 0.12) {
        c.setLineDash([5, 14]); c.lineDashOffset = -this.t * 300; c.strokeStyle = '#a9dcff'; c.lineWidth = w + 1.5; c.lineCap = 'butt';
        c.beginPath(); c.moveTo(NX, NY + 4); c.lineTo(NX, sy); c.stroke(); c.setLineDash([]);
      } else {
        c.beginPath();
        const off = y => Math.sin(y * .05 - this.t * 20) * o * 1.2;
        for (let y = NY + 4; y < sy; y += 8) c.lineTo(NX - w / 2 + off(y), y);
        c.lineTo(NX - w / 2, sy);
        c.lineTo(NX + w / 2, sy);
        for (let y = sy - 1; y > NY + 4; y -= 8) c.lineTo(NX + w / 2 + off(y), y);
        c.closePath(); c.fillStyle = 'rgba(169,220,255,.95)'; c.fill();
        c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = Math.max(1, w * .15);
        c.beginPath(); c.moveTo(NX - w * .15, NY + 4); c.lineTo(NX - w * .15, sy); c.stroke();
      }
    }
    // overflow sheets down the outer wall
    if (this.spilling) {
      const k = clamp(this.spill * 2.5, 0, 1);
      c.strokeStyle = 'rgba(110,198,255,.9)'; c.lineWidth = 8; c.lineCap = 'round';
      for (const s of [-1, 1]) {
        c.beginPath();
        for (let u = 0; u <= k; u += 0.05) {
          const x0 = s < 0 ? XL : XR, dx = s * 18 * Math.sin(u * Math.PI / 2) - s * 20 * u;
          c[u === 0 ? 'moveTo' : 'lineTo'](x0 + dx, T + u * (B - T));
        }
        c.stroke();
      }
    }
    // droplets
    c.fillStyle = '#91d9e6';
    for (const p of this.parts) { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
    // The face is on the front of the glass, above the stream and splash effects.
    this.drawFace(c);
    // tap-opening gauge
    if (this.gauge) {
      c.fillStyle = '#b6cdb98c'; c.beginPath(); c.roundRect(334, 150, 10, 300, 5); c.fill();
      const h = 300 * this.opening; c.fillStyle = `hsl(${200 - this.opening * 200},90%,60%)`;
      c.beginPath(); c.roundRect(334, 450 - h, 10, Math.max(h, 0), 5); c.fill();
    }
  }
}

/* ---------- Rules / turns ---------- */
class GameStateMachine {
  constructor() { this.state = 'SETUP'; }
  start(players) {
    this.players = players.map(p => ({ ...p, total: 0 }));
    this.capacity = 1000 + Math.floor(Math.random() * 1501);
    this.poured = this.turn = this.turns = this.turnPoured = this.turnTime = 0;
    this.loser = null; this.state = 'HANDOFF';
  }
  get cur() { return this.players[this.turn]; }
  get level() { return this.poured / this.capacity; }
  get rounds() { return Math.floor(this.turns / this.players.length) + 1; }
  beginTurn() { this.state = 'TURN'; this.turnPoured = this.turnTime = 0; }
  pour(u, dt) {
    this.turnTime += dt; this.poured += u; this.turnPoured += u; this.cur.total += u;
    if (this.level > 1.10) { this.loser = this.cur; this.state = 'OVER'; return true; }
    return false;
  }
  endPour() { // false = below minimum, same player keeps pouring
    if (this.turnPoured < MIN_POUR && this.turnTime < MIN_TIME) return false;
    this.turns++; this.turn = (this.turn + 1) % this.players.length; this.state = 'HANDOFF';
    return true;
  }
}

/* ---------- App glue ---------- */
const audio = new AudioFx(), sm = new GameStateMachine(), sim = new WaterSimulation($('#cv'));
let setupPlayers = Array.from({ length: 2 }, (_, i) => ({ name: playerName(i + 1), color: COLORS[i] }));
let beatAt = 0, vigPhase = 0, last = performance.now(), toastT = 0;

const input = new InputHandler($('#touch'), {
  start() { audio.ensure(); audio.open(); sim.flowing = true; sim.gauge = true; },
  end() {
    sim.flowing = false; sim.gauge = false; audio.flow(0);
    if (sm.state !== 'TURN') return;
    if (sm.endPour()) showHandoff();
    else {
      hint(`Too short! Pour for at least ${MIN_TIME} seconds or ${MIN_POUR} units. Hold again to continue.`);
      wrongFeedback($('#hint'));
    }
  }
});

function hint(t) { $('#hint').textContent = t; animateChange($('#hint')); }
function renderSetup() {
  $('#cnt').textContent = setupPlayers.length + ' players';
  $('#rows').innerHTML = '';
  setupPlayers.forEach((p, i) => {
    const r = document.createElement('div'); r.className = 'row';
    const sw = document.createElement('button'); sw.className = 'sw'; sw.style.background = p.color; sw.setAttribute('aria-label', 'Change colour');
    sw.onclick = () => { // next colour not used by anyone else
      const used = setupPlayers.map(q => q.color);
      for (let k = 1; k <= COLORS.length; k++) { const c = COLORS[(COLORS.indexOf(p.color) + k) % COLORS.length]; if (!used.includes(c)) { p.color = c; break; } }
      sw.style.background = p.color;
      animateChange(sw);
    };
    const inp = document.createElement('input'); inp.value = p.name; inp.maxLength = 10; inp.setAttribute('aria-label', 'Player ' + (i + 1) + ' name'); inp.oninput = () => p.name = inp.value;
    r.append(sw, inp); $('#rows').append(r);
  });
}
function resize(n) {
  n = clamp(n, 2, 6);
  while (setupPlayers.length < n) { const i = setupPlayers.length; setupPlayers.push({ name: playerName(i + 1), color: COLORS.find(c => !setupPlayers.some(p => p.color === c)) }); }
  setupPlayers.length = n; renderSetup();
}
function newGame() {
  sm.start(setupPlayers.map((p, i) => ({ name: p.name.trim() || playerName(i + 1), color: p.color })));
  sim.reset(); audio.flow(0);
  for (const s of ['#setup', '#result', '#tag', '#tension']) $(s).hidden = true;
  $('#hud').hidden = $('#bottom').hidden = false;
  showHandoff();
}
function showHandoff() {
  const p = sm.cur;
  $('#av').style.background = p.color; $('#whoName').textContent = 'Current turn: ' + p.name;
  $('#touch').classList.remove('on'); $('#go').hidden = false;
  $('#go').textContent = `${p.name}: Confirm handoff / Start pouring`;
  hint('Pass the device to ' + p.name); $('#mode').textContent = '';
}
function startTurn() {
  audio.ensure(); sm.beginTurn();
  $('#touch').classList.add('on'); $('#go').hidden = true;
  hint('Hold the screen to pour. Release to pass the turn.');
}
function overflow() {
  input.end(); input.id = null;
  sim.spilling = true; sim.flowing = false; sim.gauge = false;
  audio.flow(0); audio.splash(); navigator.vibrate?.([200, 60, 300]);
  $('#touch').classList.remove('on'); $('#bottom').hidden = true; $('#tension').hidden = true; $('#tag').hidden = false;
  const app = $('#app'); app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  $('#vig').style.opacity = 0;
  setTimeout(showResult, 2200);
}
function showResult() {
  $('#tag').hidden = true; $('#hud').hidden = true;
  $('#loser').innerHTML = `<span style="color:${sm.loser.color}">${esc(sm.loser.name)}</span> spilled the glass! 💦`;
  $('#roundInfo').textContent = `${sm.rounds} rounds · Glass capacity ${sm.capacity} units`;
  const max = Math.max(...sm.players.map(p => p.total));
  $('#stats').innerHTML = sm.players.map(p => `<div><div class="n"><span>${p === sm.loser ? '💦 ' : ''}${esc(p.name)}</span><span>${Math.round(p.total)}</span></div><div class="bar" style="width:${Math.max(3, p.total / max * 100)}%;background:${p.color}"></div></div>`).join('');
  $('[data-winner-name]').textContent = sm.players.filter(p => p !== sm.loser).map(p => p.name).join(' & ');
  for (const [index, row] of [...$('#stats').children].entries()) row.querySelector('.n > span').classList.toggle('winning-player', sm.players[index] !== sm.loser);
  $('#result').hidden = false;
  $('#again').focus({ preventScroll: true });
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (sm.state === 'TURN' && input.active) {
    const target = input.read(now);
    sim.opening += (target - sim.opening) * Math.min(1, 14 * dt);
    $('#mode').textContent = input.mode === 'pressure' ? 'Pressure mode: press harder for more water' : 'Standard mode: hold longer or slide down for more water';
    audio.flow(sim.opening);
    if (sm.pour(MAX_RATE * Math.pow(sim.opening, 1.5) * dt, dt)) { sim.level = sm.level; overflow(); }
  } else sim.opening += (0 - sim.opening) * Math.min(1, 10 * dt);
  sim.level = sm.state === 'SETUP' ? 0 : sm.level;
  sim.update(dt); sim.draw();
  // tension: heartbeat + red vignette
  const lv = sm.state === 'SETUP' || sm.state === 'OVER' ? 0 : sm.level, ten = clamp((lv - 0.6) / 0.45, 0, 1);
  if (ten > 0) {
    if (now > beatAt) { audio.heartbeat(); if (lv > 1) navigator.vibrate?.(20); beatAt = now + 1000 - ten * 600; }
    vigPhase += dt * (3 + ten * 6); $('#vig').style.opacity = reducedMotion.matches ? ten * 0.45 : ten * (0.45 + 0.4 * Math.sin(vigPhase));
  } else $('#vig').style.opacity = 0;
  $('#tension').hidden = !(lv > 1 && sm.state !== 'OVER');
  requestAnimationFrame(frame);
}

$('#minus').onclick = () => resize(setupPlayers.length - 1);
$('#plus').onclick = () => resize(setupPlayers.length + 1);
$('#start').onclick = () => { audio.ensure(); newGame(); };
$('#go').onclick = startTurn;
$('#again').onclick = () => { audio.ensure(); newGame(); };
$('#toSetup').onclick = () => { $('#result').hidden = true; $('#setup').hidden = false; $('#hud').hidden = $('#bottom').hidden = true; sm.state = 'SETUP'; sim.reset(); };
$('#mute').onclick = e => {
  audio.setMuted(!audio.muted);
  e.currentTarget.setAttribute('aria-pressed',String(audio.muted));
  e.currentTarget.setAttribute('aria-label',audio.muted?'Unmute sound':'Mute sound');
};
addEventListener('resize', () => sim.resize());
renderSetup(); requestAnimationFrame(frame);
</script>
</body>
