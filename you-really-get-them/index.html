<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8"><meta name="description" content="你真的懂他／她／牠嗎？高血壓求生模擬器。12 題之內，證明你有多懂對方。">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
  <title>你真的懂他／她／牠嗎？｜高血壓求生模擬器</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><a class="brand" id="homeLink" href="#home" aria-label="返回首頁"><span class="brand-mark">?!</span><span>關係求生研究所</span></a><div class="top-actions"><details class="action-menu" id="actionMenu"><summary aria-label="開啟功能選單">更多 <svg class="action-menu-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m3.5 6 4.5 4.5L12.5 6"/></svg></summary><div class="action-menu-panel"><button id="playerNameBtn" class="secondary-btn account-menu-btn player-name-btn" type="button" hidden>設定玩家名稱</button><button id="authBtn" class="secondary-btn account-menu-btn">Google 登入</button><div class="action-menu-divider" aria-hidden="true"></div><button id="collectionBtn" class="secondary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/cards.png" alt="" aria-hidden="true"> 收藏 <b id="cardCount">0</b></button><button id="leaderboardBtn" class="secondary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/paw-cup.png" alt="" aria-hidden="true"> 排行榜</button><button id="historyBtn" class="secondary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/heart.png" alt="" aria-hidden="true"> 我的戰績</button><button id="inviteBtn" class="secondary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/duo.png" alt="" aria-hidden="true"> 邀請好友挑戰</button><button id="soundBtn" class="secondary-btn sound-menu-btn" aria-label="切換音效"><img class="ui-icon sound-icon" src="./assets/icons/sound.png" alt="" aria-hidden="true"> 音量</button></div></details></div></header>
    <main id="app">
      <section id="home" class="screen home-screen">
        <div class="hero-copy"><h1>你真的懂<br><span>他／她／牠</span>嗎？</h1><p class="subtitle">高血壓求生模擬器</p></div>
        <div class="hero-art" aria-hidden="true"><div class="sticker sticker-top">你確定？</div><div class="polaroid"><div class="fake-photo"><img src="./assets/illustrations/woman.webp" alt="" aria-hidden="true"><i>?</i></div><p>「你再想清楚一次。」</p></div><div class="burst">生還<br>機率？</div><div class="scribble">GOOD<br>LUCK!</div></div>
        <section class="faction-section"><div class="section-heading"><h2>選擇你的挑戰陣營</h2></div><div class="faction-grid" id="factionGrid">
          <button class="faction-card pink selected" data-faction="women"><img class="faction-emoji" src="./assets/icons/woman.png" alt="" aria-hidden="true"><b>她的心思</b><small>讀心？你先讀空氣。</small></button>
          <button class="faction-card yellow" data-faction="men"><img class="faction-emoji" src="./assets/icons/man.png" alt="" aria-hidden="true"><b>他的心思</b><small>「沒事」真的沒事？</small></button>
          <button class="faction-card orange" data-faction="dog"><img class="faction-emoji" src="./assets/icons/dog.png" alt="" aria-hidden="true"><b>狗狗心思</b><small>尾巴搖不代表一切。</small></button>
          <button class="faction-card purple" data-faction="cat"><img class="faction-emoji" src="./assets/icons/cat.png" alt="" aria-hidden="true"><b>貓主子心思</b><small>你只是牠的室友。</small></button>
          <button class="faction-card duo" data-faction="duo"><img class="faction-emoji" src="./assets/icons/duo.png" alt="" aria-hidden="true"><b>雙人互測模式</b><small>情侶／好友現場出題拷問。</small></button>
        </div><a id="companionPicker" class="companion-picker" href="#collection"><div id="companionPortrait" class="companion-portrait" aria-hidden="true" hidden></div><div class="companion-copy"><strong id="equippedName">獨自求生</strong><b id="companionName">求生隊友</b><span id="companionEffect">前往求生收藏冊，選一位隊友</span></div><span class="companion-destination">求生收藏冊 →</span></a><div class="hero-actions"><button id="startBtn" class="primary-btn">開始求生 <span>→</span></button><button id="howBtn" class="secondary-btn">玩法說明</button></div></section>
        
      </section>
      <section id="game" class="screen game-screen hidden">
        <div class="game-hud"><div class="game-head"><div class="game-title"><span class="eyebrow" id="roundFaction">她的心思</span><h2><span id="questionNo">01</span><small> / 12</small></h2></div><button id="quitBtn" class="text-btn" aria-label="離開本局">退出 ×</button></div>
        <div class="status-row"><div class="hp-wrap"><div class="hp-label"><img class="ui-icon hp-icon" src="./assets/icons/heart.png" alt="" aria-hidden="true"><b id="hpValue">100</b><small>HP</small></div><div class="hp-track"><div id="hpBar" class="hp-bar"></div></div></div><div class="timer-wrap"><div class="timer-number" id="timer">30.0</div><small>SEC</small></div></div>
        </div><div id="companionBar" class="companion-action" hidden><button type="button" id="companionUse" class="secondary-btn"></button><span class="companion-clock" aria-hidden="true"><span>⏰</span><i>🔌</i></span><p id="companionLine" role="status" aria-live="polite"></p></div><div class="question-card"><div class="question-meta"><span id="questionTag">01 / 情境題</span></div><div class="question-visual" id="questionVisual"><img class="question-icon" src="./assets/icons/spark.png" alt="" aria-hidden="true"><small>OBSERVE</small></div><h3 id="questionText">題目載入中</h3><p id="questionHint" class="question-hint" aria-live="polite"></p><div id="answerReview" class="answer-review" hidden><p id="reviewStatus" role="status" aria-live="polite"></p><button type="button" id="nextQuestionBtn" class="primary-btn">下一題 →</button></div><div id="interaction" class="interaction hidden"></div><div id="answers" class="answers"></div></div>
        <div class="game-bottom"><button id="pigHintBtn" class="hint-btn"><img class="ui-icon tiny-icon" src="./assets/icons/pig.png" alt="" aria-hidden="true"> 提示 <small>−5 HP</small></button><span id="hintLeft">× 2</span><span id="runCoins" class="run-coins" title="成功存活：100 SC＋剩餘 HP × 2；陣亡：10 SC。完成結算後入帳。">預計 300 SC</span><div class="progress-dots" id="progressDots" role="progressbar" aria-label="答題進度" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"></div></div>
      </section>
      <section id="result" class="screen result-screen hidden"><div class="result-top"><h2 id="resultTitle">你活下來了？</h2><p id="resultSubtitle"></p><strong id="resultCertification" class="result-certification" hidden></strong></div><div class="result-summary"><div class="result-stat"><small>HP LEFT</small><b id="resultHp">0</b></div><div class="result-stat"><small>COINS</small><b id="resultCoins">0 SC</b></div><div class="result-stat"><small>CORRECT</small><b id="resultCorrect">0 / 12</b></div></div><section id="rewardBreakdown" class="reward-breakdown" aria-label="本局求生幣獎勵明細"></section><section id="airReport" class="air-report hidden" aria-live="polite"></section><section id="incidentReport" class="incident-report" aria-label="本日求生事故報告"></section><div class="poster-preview-wrap"><canvas id="posterPreview" width="540" height="960" aria-label="戰績海報預覽"></canvas></div><div class="result-actions"><button id="downloadPoster" class="primary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/cards.png" alt="" aria-hidden="true"> 下載事故報告海報</button><button id="sharePoster" class="secondary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/duo.png" alt="" aria-hidden="true"> 分享事故報告</button><button id="challengeAgainBtn" class="secondary-btn">建立好友挑戰</button><button id="challengeStatusBtn" class="secondary-btn">好友挑戰結果</button><button id="againBtn" class="secondary-btn"><img class="ui-icon tiny-icon" src="./assets/icons/lightning.png" alt="" aria-hidden="true"> 再挑戰一次</button></div><p class="result-footnote" id="resultQuote"></p></section>
      <section id="collection" class="screen collection-screen hidden"><div class="game-head"><div><h2>求生收藏冊</h2></div><button id="backBtn" class="text-btn">← 返回</button></div><section class="gacha-shop" aria-labelledby="gachaTitle"><div class="gacha-shop-header"><h3 id="gachaTitle">求生補給扭蛋店</h3><b id="collectionCoins" aria-label="求生幣餘額">0 SC</b></div><div class="gacha-machine" id="gachaMachine" aria-busy="false"><div class="machine-marquee" aria-hidden="true">★ ★ ★</div><div class="capsule-globe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="machine-console"><span class="machine-slot" aria-hidden="true"></span><button id="gachaDraw" class="draw-card-btn gacha-trigger" type="button"><span>開盲盒</span><small id="gachaPrice">100 SC / 每抽</small></button></div><div class="capsule-hatch" aria-hidden="true"><div class="gacha-capsule"><span></span><span></span></div></div><div class="machine-feet" aria-hidden="true"></div></div><p id="gachaStatus" class="gacha-status" role="status" aria-live="polite"></p></section><div class="companion-selection"><strong id="collectionCompanion"></strong><button type="button" id="unequipCompanion" class="secondary-btn">獨自求生</button></div><p id="companionSaveStatus" role="status" aria-live="polite"></p><div class="collection-summary"><span id="collectionCount"></span></div><div id="collectionGrid" class="collection-groups"></div></section>
    </main>
    <footer class="site-footer"><span>© 關係求生研究所</span><span>STAY CALM. PROBABLY.</span></footer>
  </div>
  <dialog id="modal"><div class="modal-inner"><button class="modal-close" id="modalClose" aria-label="關閉">×</button><div id="modalContent"></div></div></dialog>
  <script type="module" src="src/app.js"></script>
</body></html>
