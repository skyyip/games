name: Verify Millionaire rewards
on:
  push:
    branches: [millionaire-simplify-30s, millionaire-rewards, millionaire-room-rework, millionaire-visual-bank, millionaire-room-launch-ux, millionaire-full-qa, millionaire-showtime, millionaire-collections-refresh, millionaire-room-countdown-fix, millionaire-mobile-retry-fix, main]
    paths: [hong-kong-millionaire/**, tools/game-catalog.mjs, .github/workflows/millionaire-rewards.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: millionaire-rewards
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hong-kong-millionaire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run rules:check
      - run: npm run review:check
      - name: Real Firestore rules
        run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-hk-millionaire --only firestore "node scripts/firestore-check.mjs && node scripts/rewards-firestore-check.mjs"
      - name: Prepare built browser tests
        working-directory: .
        run: |
          npm ci --prefix tools
          for game in beat-bad-luck career-365 frogger-jump your-dream-career mo-lei-tau-studio; do npm ci --prefix "$game"; done
          npm install --prefix /tmp/hkm-playwright --no-save --package-lock=false playwright@1.58.2
          /tmp/hkm-playwright/node_modules/.bin/playwright install --with-deps chromium
          printf "export {chromium} from '/tmp/hkm-playwright/node_modules/playwright/index.mjs';\n" > /tmp/hkm-playwright.mjs
          BBL_ESBUILD_MODULE="$PWD/tools/node_modules/esbuild/lib/main.js" PLAYGROUND_BASE_PATH=/games/ node tools/build-site.mjs /tmp/games-built-rewards
          node tools/check-seo.mjs /tmp/games-built-rewards /games/
          mkdir -p /tmp/hkm-preview
          ln -s /tmp/games-built-rewards /tmp/hkm-preview/games
          python3 -m http.server 5445 --bind 127.0.0.1 --directory /tmp/hkm-preview > /tmp/hkm-http.log 2>&1 &
      - name: Real Firebase browser journeys
        env:
          GRID_RUSH_PLAYWRIGHT_MODULE: /tmp/hkm-playwright.mjs
          HKM_TEST_URL: http://127.0.0.1:5445/games/hong-kong-millionaire/
          HKM_BUILD_DIR: /tmp/games-built-rewards
          BBL_ESBUILD_MODULE: ${{ github.workspace }}/tools/node_modules/esbuild/lib/main.js
        run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-hk-millionaire --only auth,firestore "node scripts/firebase-browser-check.mjs"
      - name: Full gameplay
        env:
          GRID_RUSH_PLAYWRIGHT_MODULE: /tmp/hkm-playwright.mjs
          HKM_TEST_URL: http://127.0.0.1:5445/games/hong-kong-millionaire/
          HKM_BUILD_DIR: /tmp/games-built-rewards
          BBL_ESBUILD_MODULE: ${{ github.workspace }}/tools/node_modules/esbuild/lib/main.js
        run: |
          node scripts/cloud-check.mjs
          node scripts/browser-check.mjs
          node scripts/auth-transition-check.mjs
          node scripts/rewards-browser-check.mjs
          node scripts/street-observation-browser-check.mjs
          node scripts/offline-browser-check.mjs
          node scripts/showtime-browser-check.mjs
      - name: Firefox and WebKit gameplay
        working-directory: .
        env:
          HKM_TEST_URL: http://127.0.0.1:5445/games/hong-kong-millionaire/
          HKM_BUILD_DIR: /tmp/games-built-rewards
          BBL_ESBUILD_MODULE: ${{ github.workspace }}/tools/node_modules/esbuild/lib/main.js
        run: |
          /tmp/hkm-playwright/node_modules/.bin/playwright install --with-deps firefox webkit
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=hkm_ci
          pactl set-default-sink hkm_ci
          for engine in firefox webkit; do
            printf "export {%s as chromium} from '/tmp/hkm-playwright/node_modules/playwright/index.mjs';\n" "$engine" > "/tmp/hkm-$engine.mjs"
            GRID_RUSH_PLAYWRIGHT_MODULE="/tmp/hkm-$engine.mjs" node hong-kong-millionaire/scripts/browser-check.mjs
            GRID_RUSH_PLAYWRIGHT_MODULE="/tmp/hkm-$engine.mjs" node hong-kong-millionaire/scripts/showtime-browser-check.mjs
            GRID_RUSH_PLAYWRIGHT_MODULE="/tmp/hkm-$engine.mjs" node hong-kong-millionaire/scripts/rewards-browser-check.mjs
          done
      - name: Save browser preview images
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/hkm-preview-images
          find /tmp -maxdepth 1 -name 'hkm-*.png' -exec cp {} /tmp/hkm-preview-images/ \;
          if [ -n "$(find /tmp/hkm-preview-images -name '*.png' -print -quit)" ]; then
            node hong-kong-millionaire/scripts/publish-tested-tree.mjs previews/millionaire-rewards /tmp/hkm-preview-images
          fi
      - name: Publish tested website files
        if: success() && github.ref == 'refs/heads/main'
        working-directory: .
        run: node hong-kong-millionaire/scripts/publish-tested-tree.mjs downloads/games-site /tmp/games-built-rewards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: millionaire-rewards-preview
          path: |
            /tmp/hkm-*.png
            /tmp/hkm-http.log
            /tmp/hkm-firebase-browser-errors.json
            /tmp/games-built-rewards
            hong-kong-millionaire/firestore-debug.log
          if-no-files-found: ignore
